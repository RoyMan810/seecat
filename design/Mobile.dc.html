    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="box-sizing: border-box; padding: 14px 16px; border: 1px solid #1C1C26; border-radius: 14px; background: #0E0E16; display: flex; flex-direction: column; gap: 6px;">

        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: #F5F5F7;">[—] SOL</span>
      </div>
      <div style="box-sizing: border-box; padding: 14px 16px; border: 1px solid #1C1C26; border-radius: 14px; background: #0E0E16; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; color: #8F8FA0;">HOLDERS</span>

</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#14F195","options":["#14F195","#00FFA3","#9945FF","#B57CFF"],"section":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#14F195' };
  }
}
</script>
